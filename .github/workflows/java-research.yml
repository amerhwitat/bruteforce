name: Java Safe Crypto Research
on:
  push:
    paths: ["java/**", ".github/workflows/java-research.yml"]
  pull_request:
    paths: ["java/**", ".github/workflows/java-research.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: java/pom.xml
      - run: mvn -f java/pom.xml --batch-mode test
      - run: mvn -f java/pom.xml --batch-mode -DskipTests package
